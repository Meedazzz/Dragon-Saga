<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Драконья Сага — проект НРИ на базе D&D: летописи героев, личные умения и предыстории персонажей в авторском мире." />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      :root { background: #0b0b0f; color-scheme: dark; }
      body { background: #0b0b0f; margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; color: #efe5d5; }
      /* Static fallback preloader (req #8) — visible until React mounts */
      #initial-preloader {
        position: fixed; inset: 0; z-index: 99999;
        background: #0b0b0f;
        display: grid; place-items: center;
        transition: opacity 0.5s ease;
      }
      #initial-preloader .ip-inner {
        position: relative; width: min(80vw, 360px); height: min(80vw, 360px);
        display: grid; place-items: center;
      }
      #initial-preloader .ip-glow {
        position: absolute; inset: 8%; border-radius: 50%;
        background: radial-gradient(circle, #e44a5a 0%, transparent 70%);
        opacity: 0.28; filter: blur(28px);
        animation: ip-pulse 3.4s ease-in-out infinite;
        pointer-events: none;
      }
      #initial-preloader .ip-icon {
        position: relative; width: 60%; aspect-ratio: 1 / 1;
        background-color: #e44a5a;
        -webkit-mask-image: url('./ouroboros.png');
                mask-image: url('./ouroboros.png');
        -webkit-mask-size: contain;
                mask-size: contain;
        -webkit-mask-repeat: no-repeat;
                mask-repeat: no-repeat;
        -webkit-mask-position: center;
                mask-position: center;
        filter:
          drop-shadow(0 0 18px #e44a5a)
          drop-shadow(0 0 42px #e44a5a)
          drop-shadow(0 0 78px #7de4ff);
        animation: ip-spin 9s linear infinite;
        will-change: transform;
      }
      #initial-preloader .ip-label {
        position: absolute; bottom: -8%; left: 50%; transform: translateX(-50%);
        font-family: 'Cinzel', serif; letter-spacing: 6px; font-size: 0.78rem;
        text-transform: uppercase; color: #e44a5a; opacity: 0.85;
        animation: ip-pulse 3.4s ease-in-out infinite;
      }
      @keyframes ip-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ip-pulse { 0%, 100% { opacity: 0.65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
      #initial-preloader.hidden { opacity: 0; pointer-events: none; }
    </style>
    <title>Драконья Сага — D&D Chronicles</title>
  </head>
  <body>
    <!-- Static preloader shown before React mounts -->
    <div id="initial-preloader" aria-hidden="true">
      <div class="ip-inner">
        <div class="ip-glow"></div>
        <div class="ip-icon"></div>
        <div class="ip-label">Загрузка</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Once React has mounted, fade out the static preloader.
      // The React-side <Preloader> in Layout will take over for route changes.
      (function () {
        function hide() {
          var el = document.getElementById('initial-preloader');
          if (el) el.classList.add('hidden');
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 700);
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide);
        // Safety: hide after 3s no matter what
        setTimeout(hide, 3000);
      })();
    </script>
  </body>
</html>
