<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Dragon-Saga/favicon.png" />
    <link rel="apple-touch-icon" href="/Dragon-Saga/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Драконья Сага — проект НРИ на базе D&D: летописи героев, личные умения и предыстории персонажей в авторском мире." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
      :root { background: #0c0c10; }
      body { background: #0c0c10; margin: 0; }
    </style>
    <title>Драконья Сага — D&D Chronicles</title>

    <style>
      /* ════════ Десктоп: рубашка на обратной стороне expanded ════════ */
      .ds-shirt-back {
        position: relative !important;
      }
      .ds-shirt-back .ds-shirt-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        -o-object-fit: cover;
           object-fit: cover;
        border-radius: inherit;
        z-index: 0;
      }
      .ds-shirt-back .ds-shirt-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.55);
        border-radius: inherit;
        z-index: 1;
      }
      .ds-shirt-back > *:not(.ds-shirt-img):not(.ds-shirt-overlay) {
        position: relative !important;
        z-index: 2 !important;
      }

      /* ════════ Десктоп: отключаем drag на expanded-карте ════════ */
      .ds-no-drag {
        cursor: default !important;
      }
      .ds-no-drag:active {
        cursor: default !important;
      }

      /* ════════ Мобильные: 3D-переворот карточки ════════ */
      .ds-mobile-flip-wrapper {
        perspective: 1200px;
        width: 100%;
        height: 100%;
      }
      .ds-mobile-flip-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .ds-mobile-flip-inner.ds-flipped {
        transform: rotateY(180deg);
      }
      .ds-mobile-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: inherit;
        overflow: hidden;
      }
      .ds-mobile-back {
        transform: rotateY(180deg);
        position: relative;
      }
      .ds-mobile-back .ds-back-shirt {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        -o-object-fit: cover;
           object-fit: cover;
        z-index: 0;
      }
      .ds-mobile-back .ds-back-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.58);
        z-index: 1;
      }
      .ds-mobile-back .ds-back-content {
        position: relative;
        z-index: 2;
        padding: 20px 14px 16px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
      }
      .ds-lore-name {
        font-family: 'Cinzel', serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }
      .ds-lore-line {
        font-family: 'Cormorant Garamond', serif;
        font-size: 0.85rem;
        line-height: 1.55;
        color: #f6efe0;
        margin-bottom: 5px;
        text-align: center;
      }
      .ds-lore-quote {
        font-style: italic;
        color: #cab094;
      }
      .ds-flip-hint {
        font-family: 'Cinzel', serif;
        font-size: 0.6rem;
        letter-spacing: 1.5px;
        color: rgba(255,255,255,0.35);
        margin-top: 10px;
        padding-bottom: 8px;
      }
    </style>
    <script type="module" crossorigin src="/Dragon-Saga/assets/index-jnLWtV9o.js"></script>
    <link rel="stylesheet" crossorigin href="/Dragon-Saga/assets/index-89fP5tV1.css">
  </head>
  <body>
    <!-- Оригинальный React-корень — НЕ ТРОГАТЬ -->
    <div id="root"></div>

    <!-- ════════ Инъекция: рубашка + статичная expanded + мобильный переворот ════════ -->
    <script>
    (function() {
      const SHIRT = 'https://meedazzz.github.io/Dragon-Saga/shirt.png';

      const charData = [
        { id:'valery', name:'Валерий Даркбейн', color:'#e6e6fa',
          bio:['Род Даркбейнов отмечен проклятием ещё со времён Падения Асов.',
               'Валерий превращает боль, смерть и последние мгновения врагов в оружие.',
               '«Нет добра или зла. Есть только жизнь и смерть.»'] },
        { id:'brin', name:'Брин дель Хессен', color:'#a78bfa',
          bio:['Единственный сын герцога Астарии и наследник крови первых людей.',
               'В нём пробудилась сила Чёрного льда, веками спавшая в доме Хессен.',
               '«Лёд учит терпению. Терпение учит власти.»'] },
        { id:'sakris', name:'Сакрис Ульриаш', color:'#60a5fa',
          bio:['Рождённый в Бергхейме, Сакрис перерос дом, стены и ожидания рода.',
               'В нём говорит древний дух-следопыт, знающий тропы между мирами.',
               '«Лес говорит со мной. Я лишь пересказываю его слова.»'] },
        { id:'talis', name:'Таллис', color:'#f97316',
          bio:['Последний носитель песен клана Драконоборцев.',
               'С лютней на плече и мечом за спиной он собирает истории мира.',
               '«Пока я дышу — я пою.»'] },
        { id:'stive', name:'Стив', color:'#34d399',
          bio:['Ученик травника и послушник круга.',
               'Он ищет лекарство для учителя и своё место среди легенд.',
               '«Деревья говорят тише людей, но говорят правду.»'] }
      ];

      function getChar(name) {
        return charData.find(c => name.includes(c.name.split(' ')[0]));
      }

      /* ──────────────────────────────────
         1. ДЕСКТОП: рубашка + статичная expanded-карта
         ────────────────────────────────── */
      function patchExpandedCard() {
        // Ищем контейнер expanded-карты (cursor: grab)
        const grabEl = document.querySelector('[class*="cursor-grab"]');
        if (!grabEl || grabEl.dataset.dsPatched) return;
        grabEl.dataset.dsPatched = '1';

        // 1а. Отключаем drag — убираем обработчики
        grabEl.onmousedown = null;
        grabEl.ontouchstart = null;
        grabEl.onwheel = null;
        grabEl.classList.add('ds-no-drag');
        grabEl.style.cursor = 'default';

        // 1б. Находим обратную сторону (rotateY(180deg) в inline style)
        const faces = grabEl.querySelectorAll('div[style]');
        faces.forEach(face => {
          const style = face.getAttribute('style') || '';
          if (style.includes('rotateY(180deg)') && !face.dataset.dsShirt) {
            face.dataset.dsShirt = '1';
            face.classList.add('ds-shirt-back');

            // Вставляем <img> рубашки первым ребёнком
            const shirtImg = document.createElement('img');
            shirtImg.src = SHIRT;
            shirtImg.className = 'ds-shirt-img';
            shirtImg.draggable = false;
            face.insertBefore(shirtImg, face.firstChild);

            // Вставляем тёмную подложку
            const overlay = document.createElement('div');
            overlay.className = 'ds-shirt-overlay';
            face.insertBefore(overlay, shirtImg.nextSibling);
          }
        });
      }

      /* ──────────────────────────────────
         2. МОБИЛЬНЫЕ: переворот с рубашкой
         ────────────────────────────────── */
      function isMobile() {
        return window.innerWidth < 768;
      }

      function patchMobileCard(card) {
        if (card.dataset.dsMobilePatched) return;
        card.dataset.dsMobilePatched = '1';

        const img = card.querySelector('img');
        if (!img) return;
        const char = getChar(img.getAttribute('alt') || '');
        if (!char) return;

        // Сохраняем внутренности
        const originalHTML = card.innerHTML;

        // Оборачиваем в 3D-контейнер
        card.innerHTML = '';

        const wrapper = document.createElement('div');
        wrapper.className = 'ds-mobile-flip-wrapper';

        const inner = document.createElement('div');
        inner.className = 'ds-mobile-flip-inner';

        // Лицевая сторона
        const frontFace = document.createElement('div');
        frontFace.className = 'ds-mobile-face';
        frontFace.innerHTML = originalHTML;
        // Отключаем все pointer events внутри лицевой
        frontFace.querySelectorAll('*').forEach(el => el.style.pointerEvents = 'none');

        // Обратная сторона — рубашка + лор
        const backFace = document.createElement('div');
        backFace.className = 'ds-mobile-face ds-mobile-back';

        let loreHTML = '';
        loreHTML += `<img class="ds-back-shirt" src="${SHIRT}" draggable="false">`;
        loreHTML += `<div class="ds-back-overlay"></div>`;
        loreHTML += `<div class="ds-back-content">`;
        loreHTML += `<div class="ds-lore-name" style="color:${char.color}">${char.name}</div>`;
        char.bio.forEach(line => {
          const cls = line.startsWith('«') ? 'ds-lore-line ds-lore-quote' : 'ds-lore-line';
          loreHTML += `<p class="${cls}">${line}</p>`;
        });
        loreHTML += `<div class="ds-flip-hint">НАЖМИТЕ ДЛЯ ВОЗВРАТА</div>`;
        loreHTML += `</div>`;
        backFace.innerHTML = loreHTML;

        inner.appendChild(frontFace);
        inner.appendChild(backFace);
        wrapper.appendChild(inner);
        card.appendChild(wrapper);

        // Клик — переворот
        let flipped = false;
        card.onclick = (e) => {
          e.stopPropagation();
          e.preventDefault();
          flipped = !flipped;
          inner.classList.toggle('ds-flipped', flipped);
        };
      }

      /* ──────────────────────────────────
         3. Наблюдатель за DOM
         ────────────────────────────────── */
      const observer = new MutationObserver(() => {
        // Десктоп: патчим expanded-карту
        if (!isMobile()) {
          patchExpandedCard();
        }

        // Мобильные: патчим карточки в карусели
        if (isMobile()) {
          document.querySelectorAll('[role="button"]').forEach(el => {
            const label = el.getAttribute('aria-label') || '';
            if (label.includes('Открыть карту') || label.includes('карту')) {
              patchMobileCard(el);
            }
          });
        }
      });

      observer.observe(document.getElementById('root'), {
        childList: true,
        subtree: true
      });

      // Первичный проход после загрузки React
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!isMobile()) {
            patchExpandedCard();
          }
          if (isMobile()) {
            document.querySelectorAll('[role="button"]').forEach(el => {
              const label = el.getAttribute('aria-label') || '';
              if (label.includes('Открыть карту') || label.includes('карту')) {
                patchMobileCard(el);
              }
            });
          }
        }, 1500);
      });

    })();
    </script>
  </body>
</html>
